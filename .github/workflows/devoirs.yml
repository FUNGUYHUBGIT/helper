name: Devoirs EcoleDirecte
# Récupère les devoirs 3 fois par jour (heures en UTC : ~12h20, ~17h35 et ~20h45 en France l'été, une heure plus tôt l'hiver)
on:
  schedule:
    - cron: "23 10 * * *"
    - cron: "37 15 * * *"
    - cron: "47 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devoirs
  cancel-in-progress: false
jobs:
  devoirs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: robot
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer
        working-directory: robot
        run: npm install --no-audit --no-fund --silent
      - name: Tester l'accès à EcoleDirecte
        run: curl -sS -m 20 -o /dev/null -w "::notice::EcoleDirecte répond HTTP %{http_code} en %{time_total}s\n" -A "Mozilla/5.0" "https://api.ecoledirecte.com/v3/login.awp?gtk=1&v=4.97.2" || echo "::warning::EcoleDirecte injoignable depuis GitHub"
      - name: Récupérer les devoirs
        working-directory: robot
        env:
          ED_IDENTIFIANT: ${{ secrets.ED_IDENTIFIANT }}
          ED_MDP: ${{ secrets.ED_MDP }}
          HELPER_PSEUDO: ${{ secrets.HELPER_PSEUDO }}
          HELPER_MDP: ${{ secrets.HELPER_MDP }}
        run: node devoirs.mjs
